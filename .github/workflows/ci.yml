name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and dev tools
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check . --no-cache
      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and dev tools
        run: pip install -e ".[dev]"
      - name: Run unit tests (no network; live tests are env-gated)
        run: pytest -q
        env:
          # AILIVE_TEST unset: tests/integration/test_live_endpoint.py self-skips.
          AILIVE_TEST: ""

  security:
    name: Security (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and dev tools
        run: pip install -e ".[dev]"
      - name: Bandit static analysis
        run: bandit -c pyproject.toml -r app --quiet --skip B404,B603,B607,B101,B105
      # Blocking gate: known vulnerabilities in dependencies FAIL the build.
      # If a finding must be waived, pin a fixed version in pyproject.toml and
      # record the reason in the commit message — do not add continue-on-error.
      - name: Dependency audit (pip-audit)
        run: pip-audit --strict --desc
